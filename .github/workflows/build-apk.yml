name: Build APK and Release

# 每次 push 都构建 APK（校验产物），另外支持 Actions 页面手动触发。
#
# 产物分发渠道：
#   GitHub Release   预发布 ci-<sha>（每次 commit 一个，永久直链、互不覆盖），
#                    以及 v* tag 触发的正式 Release。
#   邮件             构建成功后，把一份「代理加速 + 直连」下载地址清单
#                    （proxy_<sha>.txt）作为正文发给 MAIL_TO 里的收件人。
#                    清单本身也作为 asset 放进 ci-<sha>，没收到邮件也能翻 Release。
#
# 注意：构建 ≠ 正式发布。只有打出 v* tag 时才会创建正式 Release；
# ci-<sha> 一律是 --prerelease，不会占 "Latest release"。
#
# 邮件配置（仓库 Settings → Secrets and variables → Actions）：
#   vars.SMTP_HOST          SMTP 服务器，如 smtp.qq.com
#   vars.SMTP_PORT          可选，默认 465（隐式 SSL）；其它值走 STARTTLS
#   vars.MAIL_FROM          可选，默认取 SMTP_USERNAME
#   secrets.MAIL_TO         收件人，多个用逗号分隔
#   secrets.SMTP_USERNAME   登录用户（通常就是发件邮箱）
#   secrets.SMTP_PASSWORD   密码 / 授权码 —— 多数邮箱要用「SMTP 授权码」，
#                           不是网页登录密码，用错会得到 535 认证失败。
#   任一项缺失时脚本打 notice 后正常返回，不视为构建失败。
#
# 代理域名不在这里配：它是 gen-proxy-txt.sh 里的 PROXIES 一行，改脚本即可。
on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  # 同一分支连推两次会取消上一次运行（Android 构建重，没必要都跑完）。
  # ⚠ 被取消的运行可能已经建好 ci-<sha> Release、传了 APK 就停了，
  #   且不会再补齐（后面的清单 / 邮件步骤也不会跑）—— 那个 commit 的 Release 是残缺的。
  #   要完整产物，等上一次跑完再推，或对残缺的 commit 手动重跑一次。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 创建 Release / 上传 asset 需要写权限。GITHUB_TOKEN 默认只读，
    # 不显式声明会在 gh release create / upload 时得到 403。
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 自己算短 sha，不用第三方 action：少一个供应链依赖，也少一次 tag 解析。
      # checkout 默认 fetch-depth 1 已含 HEAD，rev-parse 足够。
      - name: Compute short sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 不用 android-actions/setup-android@v3：它内部会执行 `sdkmanager tools`，
      # 而 "tools" 包早已从 SDK 仓库移除，在 ubuntu runner 上必然 "Failed to find package 'tools'"
      # 并中止整个 job。它提供的 SDK / cmdline-tools / licenses 在 runner 镜像里本来就有。
      # 版本必须与 android/build.gradle 保持一致。
      - name: Install SDK / NDK packages
        run: |
          set -euo pipefail
          # runner 镜像的 cmdline-tools 目录名可能是 latest 也可能是版本号（如 16.0），
          # 显式定位，不依赖 PATH 或镜像的具体布局。
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 3 -name sdkmanager -type f | head -1)
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::在 $SDK_ROOT 下找不到 sdkmanager，请检查 runner 镜像的 cmdline-tools 布局"
            exit 1
          fi

          "$SDKMANAGER" --version
          # 镜像已接受所有 licenses（日志中的 "All SDK package licenses accepted"），
          # 故这里不加 `yes |` 自动应答 —— 那会让 sdkmanager 正常退出时 yes 收到 SIGPIPE(141)，
          # 在 set -o pipefail 下反而把整个步骤判为失败。
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

          # 显式导出给后续步骤：Gradle 靠它定位 SDK（CI 上无 local.properties），
          # lexbor 编译步骤靠它拼 NDK 路径。原先由被移除的 action 隐式提供。
          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
          } >> "$GITHUB_ENV"

      # liblexbor_jni.so 正常应随仓库提供。若缺失（被误删 / .gitignore 误伤 / 从模板重建），
      # 就在这里实时编译，避免一路走到打包阶段才失败。
      - name: Ensure lexbor JNI library exists
        run: |
          set -euo pipefail
          JNI_SO="android/app/src/main/jniLibs/arm64-v8a/liblexbor_jni.so"
          LEXBOR_SO="android/app/src/main/jniLibs/arm64-v8a/liblexbor.so"

          # liblexbor.so 是 lexbor C 库的预编译产物，仓库内不含其源码，无法在 CI 重建。
          if [ ! -f "$LEXBOR_SO" ]; then
            echo "::error::缺少 $LEXBOR_SO。该文件无源码可重建，请从仓库恢复。"
            exit 1
          fi

          if [ -f "$JNI_SO" ]; then
            echo "已存在，跳过编译："
            ls -l "$JNI_SO"
            exit 0
          fi

          echo "未找到 $JNI_SO，实时编译（命令与 build-lexbor-jni.yml 一致）。"
          NDK_BIN="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/aarch64-linux-android24-clang++" \
            -shared -fPIC \
            -o "$GITHUB_WORKSPACE/$JNI_SO" \
            "android/app/src/main/cpp/lexbor_jni.cpp" \
            "-Isrc/lib/lexbor/arm64-v8a/include" \
            "-Landroid/app/src/main/jniLibs/arm64-v8a" \
            -llexbor -llog -std=c++17 -fexceptions -O2

          # 与 build-lexbor-jni.yml 相同的符号校验
          grep -oP 'external fun \K\w+' \
            android/app/src/main/java/com/discuzreader/LexborModule.kt \
            | sed 's/^/Java_com_discuzreader_LexborModule_/' | sort > /tmp/expected.txt
          nm -D --defined-only "$JNI_SO" \
            | grep -oP 'Java_com_discuzreader_LexborModule_\w+' | sort -u > /tmp/actual.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::实时编译产物的 JNI 符号与 LexborModule.kt 声明不匹配"
            exit 1
          fi
          echo "编译完成并通过符号校验。"

      - name: Build APK
        run: cd android && ./gradlew assembleRelease

      # 校验 APK 的原生库：确认只含 arm64-v8a，且两个 lexbor 库确实被打进去了。
      # 不断言完整的库清单 —— reanimated / screens / mmkv 等依赖都会各自产出 .so，
      # 逐个硬编码会在依赖升级时误报失败。
      - name: Verify APK native libs
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          echo "APK: $APK"
          unzip -l "$APK" | awk '/\.so$/ {print $NF}' | sort > /tmp/apk_libs.txt

          echo "=== APK 内的原生库 ==="
          cat /tmp/apk_libs.txt

          # 1) 只能有 arm64-v8a，出现其他 ABI 说明 abiFilters 失效
          if grep -v '^lib/arm64-v8a/' /tmp/apk_libs.txt | grep -q .; then
            echo "::error::APK 中存在非 arm64-v8a 的原生库："
            grep -v '^lib/arm64-v8a/' /tmp/apk_libs.txt
            exit 1
          fi

          # 2) 两个 lexbor 库必须在（jniLibs 里的东西要被真正打包）
          for required in lib/arm64-v8a/liblexbor.so lib/arm64-v8a/liblexbor_jni.so; do
            if ! grep -qx "$required" /tmp/apk_libs.txt; then
              echo "::error::APK 缺少 $required，请检查 android/app/src/main/jniLibs 是否完整。"
              exit 1
            fi
          done

          echo "校验通过：全部为 arm64-v8a，且 liblexbor.so / liblexbor_jni.so 均已打包。"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 仅在 tag 触发时发布正式 Release；分支 push / 手动触发只构建。
      - name: Detect release context
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "tag 触发，将发布正式 Release：${GITHUB_REF#refs/tags/}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF 触发，不发布正式 Release。"
          fi

      - name: Stage APK with descriptive name
        # Gradle 产出的名字固定是 app-release.apk，不含 commit，直接发布会被
        # 后续构建的同名文件覆盖（至少从 Release 读者角度看是无从分辨的）。
        # 这里复制成带 sha 的名字再传。
        #
        # 复制而非移动：原路径要留给上面的 artifact 上传。
        # 落到 dist/ 而不是 build/outputs 里 —— 上面 Verify 步骤的
        # `ls .../release/*.apk` 一旦匹配到两个文件就会变成多行字符串，
        # 把 unzip 参数搞坏。
        env:
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          src=$(ls android/app/build/outputs/apk/release/*.apk)
          mkdir -p dist
          cp "$src" "dist/discuzReader_${SHA}_arm64-v8a_release.apk"
          ls -l dist/

      - name: Publish to GitHub Release
        # 产出永久公开直链，形如：
        #   https://github.com/<owner>/<repo>/releases/download/ci-<sha>/<asset>
        # 下面生成代理清单的步骤拼的就是这个地址，所以它是下载链路的最终来源。
        #
        # 真正的创建 + 上传在 ensure-release.sh 里，带 5xx 退避重试：
        # GitHub 偶发在 POST /releases 上返回 500，而这时构建已经跑完、
        # artifact 也传了，不该因为一次 5xx 让整个 run 判失败。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          bash .github/scripts/ensure-release.sh \
            "ci-${SHA}" \
            "CI build ${SHA}" \
            "$(printf '由 build-apk.yml 自动构建。\n\n- commit: %s\n- 触发: %s\n\nasset 为 arm64-v8a 的 release APK（已内嵌 lexbor 原生库）。\nCI 产物未经发布流程验证，请自行核对。' \
              "${GITHUB_SHA}" "${GITHUB_EVENT_NAME}")" \
            "dist/discuzReader_${SHA}_arm64-v8a_release.apk"

      - name: Upload APK to Release
        if: steps.release.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.version }}
          name: ${{ steps.release.outputs.version }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 以下三步都在 build job 内，且都带 if: always() ──────────────
      # 原本它们排在独立的 summarize job 里（靠 needs: build + if: always()
      # 保住在构建失败时仍执行）。并进来之后这个语义得手动补上：job 内某个
      # 步骤失败，后续步骤默认会被跳过，而清单 / 邮件恰恰要在构建失败时也能跑。
      # 失败时的行为不变 —— 没建 release，gen-proxy-txt.sh 打 notice 后不生成
      # 文件，send-mail.py 也就不会发空邮件。

      - name: Generate proxy download links
        # 清单文件与 build-lexbor-jni.yml 各自生成、各自发布，互不干扰：
        # 两个 workflow 独立触发，不该互相等待。
        #
        # 产物清单由脚本问 GitHub 要（gh release view），不写死 asset 名 ——
        # 改产物命名或增删产物都不用动脚本。
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/gen-proxy-txt.sh \
            "ci-${{ steps.sha.outputs.short }}" \
            "${{ github.repository }}" \
            "proxy_${{ steps.sha.outputs.short }}.txt"

      - name: Upload manifest to Release
        # 清单本身也作为 asset 放进同一个 release：邮件只是通知渠道，
        # 丢了邮件还能从 Release 页面把它找回来。
        # 文件不存在（build 失败 / 没产物）时跳过，不算失败。
        #
        # 走 ensure-release.sh 而不是裸 gh：同样是图那层 5xx 重试 ——
        # 上传失败会让这个步骤判失败，邮件也就发不出去。
        # 此时 release 必然已存在，脚本只会走「补传 asset」分支；
        # title/notes 仅在该 release 意外缺失时才会用到。
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          file="proxy_${SHA}.txt"
          if [ ! -f "$file" ]; then
            echo "::notice::未生成 $file，跳过上传"
            exit 0
          fi
          bash .github/scripts/ensure-release.sh \
            "ci-${SHA}" \
            "CI build ${SHA}" \
            "由 build-apk.yml 自动构建。" \
            "$file"

      - name: Send download links by mail
        # 正文就是 proxy_<sha>.txt 原文，方便不翻 Release 也能拿到加速地址。
        # 排在清单上传之后 —— 邮件里说的内容此时确实已经在 Release 上。
        #
        # 文件不存在时脚本自己打 notice 后返回 0，不发空邮件。
        # continue-on-error：邮件只是通知，不该拖累构建结果。
        if: ${{ always() }}
        continue-on-error: true
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_BODY_FILE: proxy_${{ steps.sha.outputs.short }}.txt
          MAIL_SUBJECT: discuzReader APK 构建产物 ${{ steps.sha.outputs.short }}
        run: python3 .github/scripts/send-mail.py
